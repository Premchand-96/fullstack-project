version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 22
    commands:
      - cd backend
      - pip install -r requirements.txt
      - cd ../frontend
      - npm install

  build:
    commands:
      - echo "Running backend tests..."
      - cd ../backend
      - pytest || true

      - echo "Running frontend tests..."
      - cd ../frontend
      - npm test || true
